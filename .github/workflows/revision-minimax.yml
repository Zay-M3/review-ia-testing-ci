# =============================================================================
#  Revisor automático de PRs con MiniMax
#
#  Como funciona (resumen; detalle en docs/REVISOR-MINIMAX.md):
#    1. Baja el codigo de la RAMA BASE (confiable), no el de la PR.
#    2. Pide el diff de la PR por la API de GitHub.
#    3. Manda reglas (REVIEW.md de la base) + diff a MiniMax en UNA llamada.
#       La IA no ejecuta nada: solo devuelve texto.
#    4. El workflow publica un comentario NUEVO por revisión y marca el check.
# =============================================================================
name: Revisión automática con IA [MINIMAX]

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Un solo run por PR: si empujás de nuevo, cancela el anterior.
concurrency:
  group: revisor-minimax-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Minimo necesario. No hace falta id-token (no usamos el GitHub App de Claude).
permissions:
  contents: read
  pull-requests: write

jobs:
  revisar:
    name: 🧠 MiniMax lee el código
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PRs de forks no reciben secretos: sin este filtro fallarian en rojo.
    if: github.event.pull_request.head.repo.full_name == github.repository
    environment: MINIMAX_API_KEY
    env:
      # true  -> el check queda ROJO con "NO APTO" (visible de un vistazo).
      # false -> queda verde y solo se avisa en el comentario.
      FALLAR_SI_NO_APTO: "true"
    steps:
      # Rama BASE: el script y REVIEW.md salen de codigo ya revisado y mergeado.
      # Si usaramos el codigo de la PR, su autor podria cambiar las reglas.
      - name: 📥 Descargar el código de la rama base
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: 📄 Traer el diff de la PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr diff "$PR" --repo "$REPO" > diff.patch

      - name: 🔍 Pedirle la revisión a MiniMax
        id: ia
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          DIFF_FILE: diff.patch
          OUT_FILE: revision.md
        run: |
          # La PR que introduce este script no lo tiene aun en la rama base.
          if [ ! -f scripts/revisor-minimax.sh ]; then
            echo "codigo=4" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          veredicto="$(bash scripts/revisor-minimax.sh)"
          codigo=$?
          set -e
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          echo "veredicto=$veredicto" >> "$GITHUB_OUTPUT"
          # Un error de la API / sin veredicto NO es "NO APTO": se distingue abajo.
          exit 0

      - name: 💬 Publicar o actualizar el comentario
        if: steps.ia.outputs.codigo == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Un comentario NUEVO por cada revisión, con el commit revisado arriba
          # para distinguirlos.
          {
            echo "<!-- revisor-minimax -->"
            echo "_Revisión del commit \`${SHA:0:7}\`_"
            echo
            cat revision.md
          } > comentario.md
          gh pr comment "$PR" --repo "$REPO" --body-file comentario.md
          cat revision.md >> "$GITHUB_STEP_SUMMARY"

      - name: 🚦 Decidir el color del check
        env:
          CODIGO: ${{ steps.ia.outputs.codigo }}
          VEREDICTO: ${{ steps.ia.outputs.veredicto }}
        run: |
          case "$CODIGO" in
            0) ;;
            4) echo "::notice::La rama base aun no tiene scripts/revisor-minimax.sh (es la PR que lo agrega). Se omite la revisión; funcionará desde la próxima PR."; exit 0 ;;
            2) echo "::error::Falló la llamada a MiniMax (clave, red o API). Mirá el log del paso anterior. Esto NO es un NO APTO."; exit 1 ;;
            3) echo "::error::MiniMax respondió pero sin línea VEREDICTO. No se da por buena."; exit 1 ;;
            *) echo "::error::Código inesperado: $CODIGO"; exit 1 ;;
          esac
          if [ "$VEREDICTO" = "NO APTO" ]; then
            if [ "$FALLAR_SI_NO_APTO" = "true" ]; then
              echo "::error::VEREDICTO: NO APTO — hay reglas GRAVES. Leé el comentario de la PR."
              exit 1
            fi
            echo "::warning::VEREDICTO: NO APTO (el check queda verde por configuración)."
            exit 0
          fi
          echo "✅ VEREDICTO: APTO"
